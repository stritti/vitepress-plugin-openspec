schema: spec-driven

context: |
  Project: @stritti/vitepress-plugin-openspec, a VitePress plugin that renders an
  openspec/ folder (specs, active and archived changes) as VitePress pages with
  sidebar and nav helpers.
  Tech stack: TypeScript (ESM + CJS via tsup), vitest, Bun/npm, VitePress >= 1, Vite >= 5.
  Conventions: conventional commits (semantic-release). Specs use `## Purpose` and
  `## Requirements`; every requirement has at least one `#### Scenario:`.
  Validate with `openspec validate --specs --strict` (also runs in CI).
