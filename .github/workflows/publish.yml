name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for semantic-release to analyze commits

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify package version consistency
        id: version-check
        run: |
          # Get current version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          
          # Get published version from npm
          NPM_VERSION=$(npm view @stritti/vitepress-plugin-openspec version 2>/dev/null || echo "not found")
          echo "NPM version: $NPM_VERSION"
          
          # If no npm version, this is the first publish - proceed normally
          if [ "$NPM_VERSION" = "not found" ]; then
            echo "First publish, no version check needed."
            echo "sync_required=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # If npm version is HIGHER than package.json, this indicates a manual publish
          # This is the only case we should block
          if [ "$NPM_VERSION" != "$PACKAGE_VERSION" ]; then
            # Compare versions using node to handle semantic versioning correctly
            COMPARISON=$(node -e "
              const { compare } = require('semver');
              const npmVersion = '$NPM_VERSION';
              const pkgVersion = '$PACKAGE_VERSION';
              const result = compare(npmVersion, pkgVersion);
              if (result > 0) {
                console.log('npm_higher');
              } else if (result < 0) {
                console.log('npm_lower');
              } else {
                console.log('equal');
              }
            ")
            
            if [ "$COMPARISON" = "npm_higher" ]; then
              # npm version is higher - this is a manual publish that needs sync
              echo "::error::Version mismatch detected! npm ($NPM_VERSION) > package.json ($PACKAGE_VERSION)"
              echo "::error::This suggests a manual npm publish without semantic-release. Use the sync-version workflow to reconcile."
              echo "sync_required=true" >> $GITHUB_OUTPUT
              exit 1
            elif [ "$COMPARISON" = "npm_lower" ]; then
              # npm version is lower - this is likely a race condition with another release
              echo "::warning::Version mismatch detected! npm ($NPM_VERSION) < package.json ($PACKAGE_VERSION)"
              echo "::warning::This may indicate a concurrent release. Proceeding with release..."
              echo "sync_required=false" >> $GITHUB_OUTPUT
            else
              # Versions are equal
              echo "sync_required=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "sync_required=false" >> $GITHUB_OUTPUT
          fi

      - name: Release
        if: steps.version-check.outputs.sync_required != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
