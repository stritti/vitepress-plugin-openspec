name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for semantic-release to analyze commits

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify package version consistency
        id: version-check
        run: |
          # Get current version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          
          # Get published version from npm
          NPM_VERSION=$(npm view @stritti/vitepress-plugin-openspec version 2>/dev/null || echo "not found")
          echo "NPM version: $NPM_VERSION"
          
          # If versions differ, this is a manual publish that needs sync
          if [ "$PACKAGE_VERSION" != "$NPM_VERSION" ] && [ "$NPM_VERSION" != "not found" ]; then
            echo "::error::Version mismatch detected! package.json ($PACKAGE_VERSION) != npm ($NPM_VERSION)"
            echo "::error::This suggests a manual npm publish without semantic-release. Sync required."
            echo "sync_required=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "sync_required=false" >> $GITHUB_OUTPUT

      - name: Release
        if: steps.version-check.outputs.sync_required != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
